name: Build wind file
on:
  workflow_dispatch:
  schedule:
    - cron: "40 4,10,16,22 * * *"      # ARPEGE runs 00/06/12/18 UTC; a few hours later the run is available

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests eccodes numpy
      - name: Build wind.bin
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          MF_WIND_KEY: ${{ secrets.MF_WIND_KEY }}
        run: python build_wind.py
      - name: Add a small index page
        run: |
          cp out/meta.json out/index.json
          echo "<html><body><pre>$(cat out/meta.json)</pre></body></html>" > out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
        id: deployment
