; IasEstimator settings - edit with Notepad, then restart EuroScope (or type  .ias reload  after changing the Url)
[IAS]
; Address of YOUR wind.bin on GitHub Pages: https://<your github name>.github.io/IAS-simulation-for-Euroscope/wind.bin
Url=https://cityz-n.github.io/IAS-simulation-for-Euroscope/wind.bin
; How often the plugin checks for a new file, in minutes (the relay itself updates 4 times a day)
RefreshMinutes=30
; Round the shown IAS / TAS to the nearest N knots (1, 5, 10 ...)
RoundKt=5
; Aircraft slower than this ground speed (kt) show ---
MinGroundSpeed=40
; The combined item "Est. IAS or Mach" shows Mach from this value up, IAS below it
MachAbove=0.60
